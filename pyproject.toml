[project]
name = "gen-music-video"
version = "0.1.0"
description = "Local Ollama, YoVoice and Blender pipeline for daily abstract music videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false
